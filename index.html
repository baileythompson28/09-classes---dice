<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="dice-container">
      <div class="dice"></div>
      <div class="dice"></div>
      <div class="dice"></div>
      <div class="dice"></div>
      <div class="dice"></div>
    </div>
    <div class="control-container">
      <button id="rollBtn" type="button">Roll</button>
      <button id="resetBtn" type="button" disabled>New turn</button>
    </div>
  </div>

  <section class="scorecard">
    <h1>Scorecard</h1>
    <div id="scorecard"></div>
    <p id="gameStatus">Roll the dice to begin.</p>
  </section>

  <script src="js/dice.js"></script>
  <script>
    const dice = [...document.querySelectorAll('.dice')].map(d => new Dice(d));
    const counts = Array(7).fill(0);
    const categories = [
      { name: 'Ones', score: () => counts[1] },
      { name: 'Twos', score: () => counts[2] * 2 },
      { name: 'Threes', score: () => counts[3] * 3 },
      { name: 'Fours', score: () => counts[4] * 4 },
      { name: 'Fives', score: () => counts[5] * 5 },
      { name: 'Sixes', score: () => counts[6] * 6 },
      { name: 'Three of a kind', score: () => counts.some(c => c >= 3) ? total() : 0 },
      { name: 'Four of a kind', score: () => counts.some(c => c >= 4) ? total() : 0 },
      { name: 'Full house', score: () => counts.includes(3) && counts.includes(2) ? 25 : 0 },
      { name: 'Small straight', score: () => hasStraight(4) ? 30 : 0 },
      { name: 'Large straight', score: () => hasStraight(5) ? 40 : 0 },
      { name: 'Yahtzee', score: () => counts.includes(5) ? 50 : 0 },
      { name: 'Chance', score: () => total() }
    ];

    const saved = new Map();
    const rollBtn = document.getElementById('rollBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scorecard = document.getElementById('scorecard');
    const gameStatus = document.getElementById('gameStatus');
    let rolls = 0;
    let busy = false;
    let turnIsOver = false;

    function total() { return dice.reduce((sum, d) => sum + d.value, 0); }
    function hasStraight(n) {
      let run = 0;
      for (const value of counts.slice(1)) {
        run = value ? run + 1 : 0;
        if (run >= n) return true;
      }
      return false;
    }
    function updateCounts() {
      counts.fill(0);
      dice.forEach(d => counts[d.value]++);
    }

    // i looked this stuff up, i had no clue how to do this without it being longer than it needs to be
    function render() {
      updateCounts();
      scorecard.innerHTML = categories.map(cat => `
        <div class="row">
          <button type="button" data-cat="${cat.name}" ${saved.has(cat.name) || rolls === 0 ? 'disabled' : ''}>${cat.name}</button>
          <span>${saved.has(cat.name) ? saved.get(cat.name) : (rolls ? cat.score() : '—')}</span>
        </div>
      `).join('');

      scorecard.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => saveScore(btn.dataset.cat));
      });
    }
    //

    function saveScore(name) {
      if (saved.has(name) || busy) return;
      const score = categories.find(c => c.name === name).score();
      saved.set(name, score);
      turnIsOver = true;
      rollBtn.disabled = true;
      resetBtn.disabled = false;
      gameStatus.textContent = `Saved ${name} for ${score} points.`;
      render();
    }

    async function rollDice() {
      if (rolls >= 3 || busy || turnIsOver) return;
      busy = true;
      rolls++;
      rollBtn.disabled = true;
      render();
      await Promise.all(dice.map(d => d.roll({ rollTime: 100, speed: 30 })));
      busy = false;
      render();
      rollBtn.disabled = rolls === 3;
      if (rolls === 3) {
        turnIsOver = true;
        resetBtn.disabled = false;
        gameStatus.textContent = 'Used all 3 rolls. Choose a category.';
      } else {
        gameStatus.textContent = `Roll ${rolls} of 3 complete.`;
      }
    }

    function resetDice() {
      if (saved.size === categories.length) return;
      dice.forEach(d => d.reset());
      rolls = 0;
      turnIsOver = false;
      rollBtn.disabled = false;
      resetBtn.disabled = true;
      gameStatus.textContent = 'Roll the dice to begin.';
      render();
    }

    rollBtn.addEventListener('click', rollDice);
    resetBtn.addEventListener('click', resetDice);
    render();
  </script>
</body>
</html>
