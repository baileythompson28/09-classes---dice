<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dice</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/dice.js"></script>
</head>
<body>
    <div class="container">
        <div class="dice-container">
            <div class="dice"></div>
            <div class="dice"></div>
            <div class="dice"></div>
            <div class="dice"></div>
            <div class="dice"></div>
        </div>
        <div class="control-container">
            <button id="rollBtn" onclick="rollDice()">roll dice</button>
            <button id="resetBtn" onclick="resetDice()" disabled>new turn</button>
        </div>
    </div>
    <script>
        const diceContainers = document.querySelectorAll(".dice");
        let dice = [];
        diceContainers.forEach((container, idx)=>{
            dice.push(new Dice(container))
        });

        const rollBtn = document.querySelector("#rollBtn");
        const resetBtn = document.querySelector("#resetBtn");
        let rollCount = 0;
        let isRolling = false;

        async function rollDice(){
            if(rollCount >= 3 || isRolling) return;
            isRolling = true;
            rollCount++;
            rollBtn.disabled = true;
            let rolls = []; //will hold Promises
            dice.forEach((d) => {
                rolls.push(d.roll({rollTime: 100, speed: 30}));
            });
            await Promise.all(rolls); //hold execution until all rolls are resolved
            console.log(calculateTotal());
            isRolling = false;
            if(rollCount === 3){
                rollBtn.textContent = "turn complete";
                resetBtn.disabled = false;
            } else {
                rollBtn.disabled = false;
            }
        }
        function calculateTotal(){
            let sum = dice.reduce((accumulator, element) => {
                return accumulator + element.value;
            },0); //0 is the starting value for the accumulator
            return sum;
        }

        function resetDice(){
            dice.forEach((d) => {
                d.reset();
            });
            rollCount = 0;
            rollBtn.textContent = "roll dice";
            rollBtn.disabled = false;
            resetBtn.disabled = true;
        }
        //upper section:
        function ones(){
            return dice.filter(d => d.value === 1).length;
        }

        function twos(){
            return dice.filter(d => d.value === 2).length;
        }

        function threes(){
            return dice.filter(d => d.value === 3).length;
        }

        function fours(){
            return dice.filter(d => d.value === 4).length;
        }

        function fives(){
            return dice.filter(d => d.value === 5).length;
        }

        function sixes(){
            return dice.filter(d => d.value === 6).length;
        }

        function sumofUpperSection(){
            let sum = ones() * 1 + twos() * 2 + threes() * 3 + fours() * 4 + fives() * 5 + sixes() * 6;
            if(sum >= 63){
                return 63 + 35;
            }
            return sum;
        }

        //lower section:
        function threeOfAKind(){
            return dice.filter(d => d.value === 3).length >= 3;
        }

        function fourOfAKind(){
            return dice.filter(d => d.value === 4).length >= 4;
        }

        function fullHouse(){
            return dice.filter(d => d.value === 3).length >= 3 && dice.filter(d => d.value === 2).length >= 2;
        }

        function smallStraight(){
            return dice.filter(d => d.value === 1).length >= 1 && dice.filter(d => d.value === 2).length >= 1 && dice.filter(d => d.value === 3).length >= 1 && dice.filter(d => d.value === 4).length >= 1;
        }

        function largeStraight(){
            return dice.filter(d => d.value === 2).length >= 1 && dice.filter(d => d.value === 3).length >= 1 && dice.filter(d => d.value === 4).length >= 1 && dice.filter(d => d.value === 5).length >= 1 && dice.filter(d => d.value === 6).length >= 1;
        }

        function yahtzee(){
            return dice.filter(d => d.value === 5).length >= 5;
        }

        function additionalYahtzee(){
        }

        function chance(){
            return true;
        }

        function totalScore(){
            return sumofUpperSection() + (threeOfAKind() ? 3 : 0) + (fourOfAKind() ? 4 : 0) + (fullHouse() ? 5 : 0) + (smallStraight() ? 6 : 0) + (largeStraight() ? 7 : 0) + (yahtzee() ? 8 : 0) + (additionalYahtzee() ? 8 : 0) + (chance() ? dice.reduce((acc, d) => acc + d.value, 0) : 0);
        }

    </script>
</body>
</html>
